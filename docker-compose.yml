services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ${WEB_IMAGE:-workbench-web:latest}
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: ${APP_IMAGE:-workbench-app:latest}
    env_file: .env
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
