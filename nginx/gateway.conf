# gateway.conf —— 443 SNI 四层透传网关（独立 gw 容器使用）
#
# 用途：本地 hosts 把 github.com 等域名指到本服务器，由本网关按 TLS SNI
#       原样转发到真实站点。TLS 端到端不解密，无需证书，证书校验不受影响。
# 注意：本文件是完整的 nginx 主配置（含 events/stream 顶级块），
#       与 web 容器的 conf.d 片段（HTTP）不是同一种文件，勿混用。
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

stream {
    # 域名→后端为变量时需显式 resolver（阿里公共 DNS）
    resolver 223.5.5.5 ipv6=off valid=300s;

    map $ssl_preread_server_name $gw_target {
        github.com                    github.com:443;
        api.github.com                api.github.com:443;
        codeload.github.com           codeload.github.com:443;
        objects.githubusercontent.com objects.githubusercontent.com:443;
        raw.githubusercontent.com     raw.githubusercontent.com:443;
        # 未登记的 SNI 直接拒绝，避免变成开放转发
        default                       127.0.0.1:9;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $gw_target;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }
}
