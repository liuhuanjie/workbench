# 自动构建并推送镜像到阿里云 ACR（国内服务器推荐）
# 触发：push 到 main 分支，或手动触发（Actions 页面 → Run workflow）
#
# 前置配置（GitHub 仓库 → Settings → Secrets and variables → Actions）：
#   ACR_REGISTRY   阿里云 ACR 地址，如 registry.cn-hangzhou.aliyuncs.com
#   ACR_NAMESPACE  ACR 命名空间，如 lujiamin
#   ACR_USERNAME   ACR 访问凭证用户名（阿里云账号全名或 RAM 子账号）
#   ACR_PASSWORD   ACR 访问凭证固定密码（ACR 控制台 → 访问凭证 → 设置）
#
# ACR 控制台需预先创建两个镜像仓库：<命名空间>/workbench-app 与 <命名空间>/workbench-web

name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push app image (Go)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/workbench-app:latest

      - name: Build and push web image (Vue3 + Nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/workbench-web:latest
